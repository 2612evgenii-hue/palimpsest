name: Сообщить об ошибке
description: Воспроизводимый сбой, обход гейта или неверный результат
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте реальные учебные работы, персональные данные,
        credentials или приватные detector screenshots.

  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: "3.5.0"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Опишите фактический и ожидаемый результат.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Минимальное воспроизведение
      description: Команды и synthetic fixture без чувствительных данных.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Вывод
      description: Return code, stderr и релевантный фрагмент JSON.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: Я удалил персональные данные, credentials и приватные тексты.
          required: true
